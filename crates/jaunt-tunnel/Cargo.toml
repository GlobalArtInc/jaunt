[package]
name = "jaunt-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.2"
h2 = "0.4.20"
http = "1.5.0"
jaunt-limits = { workspace = true }
jaunt-proto = { workspace = true }
rand = "0.10.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { workspace = true }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.20", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
