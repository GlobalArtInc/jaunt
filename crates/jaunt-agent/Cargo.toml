[package]
name = "jaunt-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.2"
clap = { workspace = true }
h2 = "0.4.20"
hostname = "0.4.2"
http = "1.5.0"
http-body = "1.1.0"
httpdate = "1.0.3"
hyper = { version = "1.13.0", default-features = false, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
jaunt-host-users = { workspace = true }
jaunt-kube = { workspace = true }
jaunt-limits = { workspace = true }
jaunt-proto = { workspace = true }
jaunt-tunnel = { workspace = true }
jaunt-ssh = { workspace = true }
jaunt-record = { workspace = true }
rand = "0.10.4"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "net", "process", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = "1.0.154"
sha2 = "0.11.1"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "getrandom"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.20", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "std"] }
url = "2.5.9"
x509-parser = "0.18.1"
zeroize = "1.9.2"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "0.1.5"
jaunt-gate = { workspace = true }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
russh = { version = "=0.65.4", default-features = false, features = ["ring"] }
tempfile = "3.27.0"
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
