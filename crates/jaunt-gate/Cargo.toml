[package]
name = "jaunt-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ipnet = "2.12.2"
jaunt-limits = { workspace = true }
jaunt-proto = { workspace = true }
jaunt-tunnel = { workspace = true }
jaunt-ssh = { workspace = true }
rand = "0.10.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.1"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
x509-parser = "0.18.1"

[dev-dependencies]
bytes = "1.12.2"
h2 = "0.4.20"
http = "1.5.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
russh = { version = "=0.65.4", default-features = false, features = ["ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
