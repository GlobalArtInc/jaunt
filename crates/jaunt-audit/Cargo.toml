[package]
name = "jaunt-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
testing = []

[dependencies]
jaunt-proto = { workspace = true }
jaunt-record = { workspace = true }
jaunt-store = { workspace = true }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
serde = { workspace = true }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
proc-macro2 = "1.0.107"
syn = { version = "2.0.119", features = ["full", "visit"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
