[package]
name = "jaunt-recording-s3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
testing = ["dep:async-trait"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
bytes = "1.12.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jaunt-audit = { workspace = true }
jaunt-record = { workspace = true }
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5.9"

[dev-dependencies]
jaunt-recording-s3 = { path = ".", features = ["testing"] }
async-trait = "0.1.92"
jaunt-store = { workspace = true }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }
