[package]
name = "jauntd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false }
clap = { workspace = true }
hyper = { version = "1.13.0", default-features = false, features = ["http2", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http2", "tokio"] }
ipnet = "2.12.2"
serde = { workspace = true }
serde-saphyr = { workspace = true }
jaunt-audit = { workspace = true }
jaunt-ca = { workspace = true }
jaunt-control = { workspace = true }
jaunt-gate = { workspace = true }
jaunt-oidc = { workspace = true }
jaunt-policy = { workspace = true }
jaunt-proto = { workspace = true }
jaunt-ssh = { workspace = true }
jaunt-store = { workspace = true }
jaunt-tunnel = { workspace = true }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.20", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "std"] }
url = "2.5.9"

[dev-dependencies]
jaunt-audit = { workspace = true, features = ["testing"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.2"
h2 = "0.4.20"
http = "1.5.0"
russh = { version = "=0.65.4", default-features = false, features = ["ring"] }
rustix = { version = "1.1.6", default-features = false, features = ["process", "std"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
