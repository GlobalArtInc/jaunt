[package]
name = "jaunt-fake-idp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "jaunt-fake-idp"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.23.1"
clap = { workspace = true }
ed25519-dalek = "3.0.0"
form_urlencoded = "1.2.3"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.4"
serde = { workspace = true }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
