[package]
name = "jaunt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { workspace = true }
hostname = "0.4.2"
jaunt-limits = { workspace = true }
jaunt-proto = { workspace = true }
jaunt-policy = { workspace = true, features = ["schema"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { workspace = true }
serde_json = "1.0.154"
sha2 = "0.11.1"
ssh-encoding = { version = "0.2.0", default-features = false, features = ["alloc"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "getrandom"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
url = "2.5.9"
x509-parser = { version = "0.18.1", features = ["verify"] }
zeroize = "1.9.2"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
