[package]
name = "jaunt-ca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
age = "0.11.5"
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
jaunt-proto = { workspace = true }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "x509-parser"] }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
rustls-pki-types = "1.16.0"
signature = "2"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "getrandom"] }
time = { version = "0.3.55", default-features = false }
uuid = "1.29.3"
x509-parser = "0.18.1"
zeroize = "1.9.2"

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tempfile = "3.27.0"
