data_dir: /var/lib/jauntd
listen: 127.0.0.1:8443
agents_listen: 0.0.0.0:8444
public_url: https://jaunt.example.com
agent_endpoint: jaunt.example.com:8444
ssh_suffix: nodes.example.com
gate_endpoint: jaunt.example.com:2222
cert_ttl_secs: 28800
policy_dir: /etc/jaunt/policy
policy_poll_secs: 5
device_login: true
client_ip_header: X-Forwarded-For
client_ip_trusted_proxies: [127.0.0.1/32]
web: true
ssh_gate:
  listen: 0.0.0.0:2222
  hostnames: [jaunt.example.com]
oidc:
  issuer_url: https://idp.example.com
  client_id: jaunt
  client_secret_file: /etc/jaunt/oidc-client-secret
  scopes: [openid, email, profile, groups]
  username_claim: preferred_username
  groups_claim: groups
  require_verified_email: true
audit:
  jsonl: stdout
  database: true
  retention_days: 365
recordings:
  store: directory
  dir: /var/lib/jauntd/recordings
web_terminal:
  enabled: true
  max_per_user: 4
  max_total: 64
  idle_timeout_secs: 1800
