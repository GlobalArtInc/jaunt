apiVersion: v1
kind: ConfigMap
metadata:
  name: jaunt-config
  namespace: jaunt
data:
  jauntd.yaml: |
    data_dir: /var/lib/jaunt
    listen: 0.0.0.0:8443
    agents_listen: 0.0.0.0:8444
    public_url: https://jaunt.example.com
    agent_endpoint: jaunt.example.com:8444
    ssh_suffix: nodes.example.com
    gate_endpoint: jaunt.example.com:2222
    policy_dir: /etc/jaunt/policy
    ssh_gate:
      listen: 0.0.0.0:2222
      hostnames: [jaunt.example.com]
    oidc:
      issuer_url: https://idp.example.com
      client_id: jaunt
      client_secret_file: /etc/jaunt/secrets/oidc-client-secret
    recordings:
      dir: /var/lib/jaunt/recordings
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaunt-policy
  namespace: jaunt
data:
  roles.yaml: |
    apiVersion: jaunt/v1
    kind: Role
    metadata: { name: operators }
    spec:
      members:
        users: [alice@example.com]
      ssh:
        nodes: { env: [staging] }
        logins: [deploy]
      admin: [nodes.approve, sessions.read, recordings.read, revocations.write, audit.read]
