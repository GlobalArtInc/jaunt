apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaunt
  namespace: jaunt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaunt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaunt
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jauntd
          image: registry.example.com/jaunt/jaunt:0.0.0
          args: ["run"]
          env:
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: 8443
            - name: agents
              containerPort: 8444
            - name: ssh
              containerPort: 2222
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/jaunt
            - name: config
              mountPath: /etc/jaunt/jauntd.yaml
              subPath: jauntd.yaml
              readOnly: true
            - name: policy
              mountPath: /etc/jaunt/policy
              readOnly: true
            - name: secrets
              mountPath: /etc/jaunt/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: jaunt-data
        - name: config
          configMap:
            name: jaunt-config
        - name: policy
          configMap:
            name: jaunt-policy
        - name: secrets
          secret:
            secretName: jaunt-secrets
            defaultMode: 0440
