apiVersion: v1
kind: Service
metadata:
  name: jaunt
  namespace: jaunt
spec:
  selector:
    app.kubernetes.io/name: jaunt
  ports:
    - name: http
      port: 8443
      targetPort: http
    - name: agents
      port: 8444
      targetPort: agents
    - name: ssh
      port: 2222
      targetPort: ssh
