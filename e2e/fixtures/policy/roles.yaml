apiVersion: jaunt/v1
kind: Role
metadata: { name: ops }
spec:
  members: { users: [alice@e2e.test] }
  ssh:
    nodes: { env: [test, prod] }
    logins: [deploy]
    portForwarding: true
    recordInput: false
---
apiVersion: jaunt/v1
kind: Role
metadata: { name: limited }
spec:
  members: { users: [bob@e2e.test] }
  ssh:
    nodes: { env: [test] }
    logins: [deploy]
    portForwarding: false
---
apiVersion: jaunt/v1
kind: Role
metadata: { name: admins }
spec:
  members: { users: [admin@e2e.test] }
  admin: [nodes.approve, sessions.read, recordings.read, revocations.write, audit.read]
---
apiVersion: jaunt/v1
kind: Role
metadata: { name: audited }
spec:
  members: { users: [dave@e2e.test] }
  ssh:
    nodes: { env: [test, prod] }
    logins: [deploy]
    portForwarding: false
    recordInput: true
---
apiVersion: jaunt/v1
kind: Role
metadata: { name: session-viewers }
spec:
  members: { users: [viewer@e2e.test] }
  admin: [sessions.read]
---
apiVersion: jaunt/v1
kind: Role
metadata: { name: onboarding }
spec:
  members: { users: [alice@e2e.test, erin@e2e.test] }
  ssh:
    nodes: { env: [test, prod] }
    logins: [hu-off, hu-yes, hu-no, hu-denied, hu-group, hu-home, hu-full, hu-uid, hu-r1, hu-r2, hu-r3, hu-r4, hu-r5, hu-r6, hu-race, hu-restart, hu-allow, hu-repeat, hu-web1, hu-web2, hu-wgrp, hu-wuncreated, hu-sd1, hu-sd2, hu-sd3, postgres]
    portForwarding: false
