name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: jaunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just ci
      - run: just pg-migrations
        env:
          DATABASE_URL: postgres://postgres:jaunt@localhost:5432/postgres
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just installer-containers
        env:
          CONTAINER_ENGINE: docker
  ssh-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just ssh-containers
        env:
          CONTAINER_ENGINE: docker
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONTAINER_ENGINE: docker
      E2E_PROJECT: jaunt-e2e-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/cache@v4
        with:
          path: |
            target/cargo-home
            target/installer-linux
          key: e2e-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: e2e-linux-
      - run: just e2e
      - run: just e2e-down
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: target/e2e/logs
