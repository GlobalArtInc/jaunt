name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version such as 1.2.3 or 1.2.3-rc.1, without a leading v (default: the Cargo version plus the short commit)"
        type: string
        default: ""
      publish:
        description: "Publish the release (otherwise it stays a draft)"
        type: boolean
        default: false
      include_arm:
        description: "Build and check the Linux aarch64 archives (needs an arm64 runner)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CONTAINER_ENGINE: docker

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      draft: ${{ steps.plan.outputs.draft }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      release: ${{ steps.plan.outputs.release }}
      archives: ${{ steps.plan.outputs.archives }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      verify_matrix: ${{ steps.plan.outputs.verify_matrix }}
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version and what to do with the result
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_INCLUDE_ARM: ${{ inputs.include_arm }}
        run: |
          set -eu
          scripts/release-plan.sh > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build and package
        run: scripts/release-build.sh "$TARGET" dist

      - name: Check the macOS binary
        if: runner.os == 'macOS'
        run: |
          set -eu
          tar -xzf "dist/jaunt-$VERSION-$TARGET.tar.gz" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/jaunt-$VERSION-$TARGET/jaunt"
          expected=${TARGET%%-*}
          if [ "$expected" = aarch64 ]; then
            expected=arm64
          fi
          archs=$(lipo -archs "$binary")
          if [ "$archs" != "$expected" ]; then
            echo "::error::the binary has the architectures '$archs', expected '$expected'"
            exit 1
          fi
          foreign=$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$foreign" ]; then
            echo "::error::the binary links libraries outside the system: $foreign"
            exit 1
          fi
          if [ "$expected" = "$(uname -m)" ]; then
            "$binary" --version
          fi

      - name: actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.target }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: [prepare, build]
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.verify_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-${{ matrix.arch }}-unknown-linux-musl
          path: dist

      - name: Check the archives on the target distributions
        run: |
          set -eu
          cat dist/SHA256SUMS.* > dist/SHA256SUMS
          scripts/verify-release.sh dist

  release:
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      DRAFT: ${{ needs.prepare.outputs.draft }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      ARCHIVES: ${{ needs.prepare.outputs.archives }}
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Assemble the checksums
        run: |
          set -eu
          cd dist
          cat SHA256SUMS.* | LC_ALL=C sort -k2 > SHA256SUMS
          rm SHA256SUMS.*
          count=$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$count" -ne "$ARCHIVES" ]; then
            echo "::error::expected $ARCHIVES archives, found $count"
            exit 1
          fi
          cd ..
          VERIFY_CONTAINERS=0 scripts/verify-release.sh dist

      - name: actions/attest-build-provenance v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Create the draft, upload every file, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          case "$state" in
            true)
              echo "::notice::a draft release for $TAG exists from an earlier run; deleting it and starting again"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
              ;;
            false)
              echo "::error::the release $TAG is already published; it is never replaced"
              exit 1
              ;;
          esac
          flags=(--repo "$GITHUB_REPOSITORY" --draft --title "jaunt $VERSION" --generate-notes)
          if [ "$EVENT" = push ]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")
          fi
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" dist/*.tar.gz dist/SHA256SUMS
          if [ "$DRAFT" = false ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
